<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Maps Business Exporter</title>

    <link rel="stylesheet" href="popup.css">

</head>

<body>

    <!-- ======================================================
        HEADER
    ====================================================== -->

    <div class="header">

        <h2>Maps Business Exporter</h2>

        <button
            id="closePopup"
            class="close-button"
            title="Close"
            aria-label="Close"
        >
            &times;
        </button>

    </div>


    <!-- ======================================================
        SEARCH
    ====================================================== -->

    <div class="section">

        <h3>Search</h3>


        <label for="businessType">
            Business Type
        </label>

        <select id="businessType">

            <option value="restaurants">
                Restaurants
            </option>

            <option value="cafes">
                Cafes
            </option>

            <option value="hotels">
                Hotels
            </option>

            <option value="hospitals">
                Hospitals
            </option>

            <option value="schools">
                Schools
            </option>

            <option value="colleges">
                Colleges
            </option>

            <option value="gyms">
                Gyms
            </option>

            <option value="salons">
                Salons
            </option>

            <option value="pharmacies">
                Pharmacies
            </option>

            <option value="IT companies">
                IT Companies
            </option>

        </select>


        <label for="city">
            City
        </label>

        <input
            type="text"
            id="city"
            placeholder="Enter city"
            value="Nagpur"
        >

    </div>


    <!-- ======================================================
        LARAVEL JOB
    ====================================================== -->

    <div class="section">

        <h3>Laravel Job</h3>


        <label for="jobId">
            Job ID
        </label>

        <input
            type="number"
            id="jobId"
            placeholder="Example: 1"
            min="1"
        >


        <button id="loadJob">
            Load Job
        </button>


        <p id="jobStatus"></p>


        <div id="jobDetails">

            <p>
                Source:
                <strong id="sourceName">-</strong>
            </p>

            <p>
                Search:
                <strong id="jobSearchQuery">-</strong>
            </p>

        </div>

    </div>


    <!-- ======================================================
        DATA TO COLLECT
    ====================================================== -->

    <div class="section">

        <h3>Data to collect</h3>


        <label>

            <input
                type="checkbox"
                id="collectBusinessDetails"
                checked
            >

            Business Details

        </label>


        <label>

            <input
                type="checkbox"
                id="collectReviews"
                checked
            >

            Reviews

        </label>


        <label>

            <input
                type="checkbox"
                id="collectPhotos"
                checked
            >

            Photos

        </label>

    </div>


    <!-- ======================================================
        START EXTRACTION
    ====================================================== -->

    <button
        id="startExtraction"
        class="primary-button"
    >
        Start Extraction
    </button>


    <p id="status"></p>


    <!-- ======================================================
        EXTRACTION STATISTICS
    ====================================================== -->

    <div class="section">

        <h3>Extraction Status</h3>


        <p id="count">
            Businesses collected: 0
        </p>


        <p id="progress">
            Ready
        </p>


        <p id="autoStatus">
            Waiting for extraction.
        </p>

    </div>


    <!-- ======================================================
        LARAVEL STATISTICS
    ====================================================== -->

    <div class="section">

        <h3>Laravel</h3>


        <p>
            Businesses imported:
            <strong id="laravelBusinesses">
                0
            </strong>
        </p>


        <p>
            Reviews imported:
            <strong id="laravelReviews">
                0
            </strong>
        </p>


        <p>
            Photos imported:
            <strong id="laravelPhotos">
                0
            </strong>
        </p>

    </div>


    <!-- ======================================================
        ACTIONS
    ====================================================== -->

    <button id="export">
        Export CSV
    </button>


    <button id="clear">
        Clear Data
    </button>


    <!-- ======================================================
        JAVASCRIPT
    ====================================================== -->

    <script src="csv.js"></script>
    <script src="popup.js"></script>

</body>

</html>
